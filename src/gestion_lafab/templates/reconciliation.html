<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapprochement des initiations — Gestion La Fabrique</title>
  <script type="module" src="/static/datastar.js"></script>
  <style>
    :root {
      --text: #0b0b0b; --muted: #52514e; --grid: #e6e5e1;
      --surface: #fcfcfb; --error: #cf222e; --warn-bg: #fff4d6;
    }
    body { font-family: system-ui, sans-serif; color: var(--text); background: var(--surface);
           max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    header h1 { display: inline; margin-right: 1rem; }
    form.reconcile { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; margin: 1rem 0; }
    label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); gap: .25rem; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    .warn { background: var(--warn-bg); padding: .4rem .6rem; border-radius: 4px; }
    form.download { display: inline; margin-left: .5rem; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { padding: .3rem .5rem; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
    thead th { color: var(--muted); font-weight: 600; }
    tr.incomplete td { background: var(--warn-bg); }
    td.missing::after { content: "à compléter"; color: var(--muted); font-style: italic; }
  </style>
</head>
<body data-signals="{running: false}">
  <header>
    <h1>Rapprochement des initiations</h1>
    <a href="/initiations">Initiations</a>
  </header>
  <form class="reconcile" enctype="multipart/form-data"
        data-on:submit="$running = true; @post('/initiations/rapprochement', {contentType: 'form'})">
    <label>Mois<input type="month" name="mois" value="{{ month }}" required></label>
    <label>Export des tickets TiBillet<input type="file" name="export" accept=".json,application/json"></label>
    <button type="submit" data-attr:disabled="$running">Rapprocher</button>
  </form>
  {{ result | safe }}
</body>
</html>
