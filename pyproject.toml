[project]
name = "gestion-lafab"
version = "0.1.0"
description = "Application web locale de gestion de La Fabrique (Paheko, TiBillet)"
readme = "README.md"
authors = [{ name = "Joris Rehm", email = "joris@jirm.eu" }]
requires-python = ">=3.13"
dependencies = [
    "datastar-py>=1.0.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litestar>=2.25.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
gestion-lafab = "gestion_lafab.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.4",
]
